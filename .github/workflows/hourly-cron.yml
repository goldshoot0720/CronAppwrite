name: cron-hourly-insert

# 每小時整點在 Appwrite 的 cron 表新增一筆資料。
# 注意：GitHub 的 cron 以 UTC 計算；資料時間由腳本依 CRON_TZ 換算，不會寫錯時區。
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 執行模式
        type: choice
        options:
          - write
          - dry_run
          - setup
        default: write
      database_id:
        description: 資料庫 ID（留空＝用 secrets 的 APPWRITE_DATABASE_ID）
        type: string
        required: false
      table_id:
        description: 表 ID（留空＝用 secrets 的 APPWRITE_TABLE_ID）
        type: string
        required: false

permissions:
  contents: read

# 避免上一輪還沒跑完又疊一輪
concurrency:
  group: cron-hourly-insert
  cancel-in-progress: false

jobs:
  insert:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      APPWRITE_ENDPOINT: ${{ secrets.APPWRITE_ENDPOINT }}
      APPWRITE_PROJECT_ID: ${{ secrets.APPWRITE_PROJECT_ID }}
      APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
      APPWRITE_DATABASE_ID: ${{ secrets.APPWRITE_DATABASE_ID }}
      APPWRITE_TABLE_ID: ${{ secrets.APPWRITE_TABLE_ID }}
      # 手動觸發時可臨時指定，優先於上面的 secrets
      APPWRITE_DATABASE_ID_OVERRIDE: ${{ inputs.database_id }}
      APPWRITE_TABLE_ID_OVERRIDE: ${{ inputs.table_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: 建立 / 補齊表與欄位
        if: inputs.mode == 'setup'
        run: node scripts/setup-table.mjs

      - name: 新增一筆資料
        if: inputs.mode != 'setup'
        env:
          # auto = 先試 TablesDB（tables/rows），找不到就退回舊版 collections/documents
          APPWRITE_MODE: auto
          CRON_TZ: Asia/Taipei
          # 排程觸發時 inputs.mode 為空 → 視為 write
          DRY_RUN: ${{ inputs.mode == 'dry_run' && '1' || '0' }}
        run: node scripts/insert-cron.mjs
